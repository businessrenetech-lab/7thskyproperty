<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="floorPlinth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="chairFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#012a4e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00AEEF"/>
    </linearGradient>
    <linearGradient id="goldBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="tableGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="12" stdDeviation="10" flood-color="#012a4e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Base Isometric Hardwood / Tile Room Plinth -->
  <g transform="translate(400, 620)">
    <path d="M -250,55 L 0,180 L 0,205 L -250,80 Z" fill="#0284c7" opacity="0.8" />
    <path d="M 0,180 L 250,55 L 250,80 L 0,205 Z" fill="#012a4e" opacity="0.95" />
    <path d="M 0,-45 L 250,55 L 0,180 L -250,55 Z" fill="url(#floorPlinth)" stroke="#ffffff" stroke-width="2" />
    <!-- Floor Tile Isometric Lines -->
    <path d="M -150,-5 L 100,120" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M -50,-35 L 200,90" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M -150,115 L 100,-10" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M -50,145 L 200,20" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Architectural 3D Blueprint Roll (Unfurled on Floor) -->
  <g transform="translate(240, 520) rotate(-10)" filter="url(#dropShadow)">
    <path d="M -90,-40 L 90,-40 L 110,60 L -70,60 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <!-- Blueprint CAD Grid -->
    <line x1="-70" y1="-20" x2="90" y2="-20" stroke="#ffffff" stroke-width="1" opacity="0.6" />
    <line x1="-70" y1="0" x2="90" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.6" />
    <line x1="-70" y1="20" x2="100" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.6" />
    <line x1="-70" y1="40" x2="105" y2="40" stroke="#ffffff" stroke-width="1" opacity="0.6" />
    <rect x="-40" y="-15" width="60" height="40" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9" />
    <text x="-35" y="10" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">LIVING 3D</text>
    <!-- Blueprint Cylindrical Rolled Edge -->
    <ellipse cx="90" cy="-40" rx="8" ry="16" fill="#012a4e" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Modern Designer Lounge Armchair -->
  <g transform="translate(420, 420)" filter="url(#dropShadow)">
    <!-- Wooden legs -->
    <line x1="-50" y1="80" x2="-65" y2="135" stroke="url(#goldBrass)" stroke-width="6" stroke-linecap="round" />
    <line x1="50" y1="80" x2="65" y2="135" stroke="url(#goldBrass)" stroke-width="6" stroke-linecap="round" />
    <line x1="-15" y1="90" x2="-25" y2="145" stroke="url(#goldBrass)" stroke-width="6" stroke-linecap="round" />
    <line x1="20" y1="90" x2="30" y2="145" stroke="url(#goldBrass)" stroke-width="6" stroke-linecap="round" />

    <!-- Chair Seat Cushion -->
    <ellipse cx="0" cy="70" rx="75" ry="38" fill="url(#chairFabric)" stroke="#38bdf8" stroke-width="2" />
    <ellipse cx="0" cy="65" rx="68" ry="32" fill="#012a4e" />

    <!-- Curved Ergonomic Backrest -->
    <path d="M -70,60 C -85,-30 85,-30 70,60 C 50,45 -50,45 -70,60 Z" fill="url(#chairFabric)" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Deep Button Tufting Details -->
    <circle cx="-30" cy="15" r="4" fill="#00AEEF" />
    <circle cx="0" cy="15" r="4" fill="#00AEEF" />
    <circle cx="30" cy="15" r="4" fill="#00AEEF" />
    <circle cx="-15" cy="35" r="4" fill="#00AEEF" />
    <circle cx="15" cy="35" r="4" fill="#00AEEF" />

    <!-- Cyan Accent Pillow -->
    <rect x="-24" y="40" width="48" height="38" rx="12" fill="url(#cushionGrad)" stroke="#ffffff" stroke-width="1.5" transform="rotate(12)" />
  </g>

  <!-- Sleek Frosted Glass Coffee Table with Teacup & Books -->
  <g transform="translate(560, 480)" filter="url(#dropShadow)">
    <!-- Table Legs (Tripod) -->
    <line x1="0" y1="10" x2="-25" y2="70" stroke="url(#goldBrass)" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="10" x2="25" y2="70" stroke="url(#goldBrass)" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="10" x2="0" y2="75" stroke="url(#goldBrass)" stroke-width="5" stroke-linecap="round" />
    <!-- Glass Table Top -->
    <ellipse cx="0" cy="10" rx="65" ry="30" fill="url(#tableGlass)" stroke="#ffffff" stroke-width="3" />
    <ellipse cx="0" cy="8" rx="55" ry="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    
    <!-- Design Book & Coffee Cup -->
    <polygon points="-20,-2 5,-12 30,-2 5,8" fill="#012a4e" stroke="#38bdf8" stroke-width="1" />
    <polygon points="-20,-5 5,-15 30,-5 5,5" fill="#ffffff" />
    <ellipse cx="12" cy="-4" rx="7" ry="4" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Modern Arched Floor Lamp -->
  <g transform="translate(260, 280)" filter="url(#dropShadow)">
    <ellipse cx="20" cy="240" rx="40" ry="18" fill="#012a4e" stroke="url(#goldBrass)" stroke-width="2" />
    <!-- Arcing Golden Stem -->
    <path d="M 20,240 C 20,40 140,20 140,70" fill="none" stroke="url(#goldBrass)" stroke-width="6" stroke-linecap="round" />
    <!-- Dome Lampshade -->
    <path d="M 115,70 C 115,45 165,45 165,70 Z" fill="#012a4e" stroke="url(#goldBrass)" stroke-width="2" />
    <ellipse cx="140" cy="70" rx="25" ry="10" fill="#fef08a" />
    <!-- Warm Ambient Light Glow -->
    <polygon points="140,75 70,220 210,220" fill="#fef08a" opacity="0.25" />
  </g>

  <!-- Potted Fiddle Leaf Fig / Monstera Plant -->
  <g transform="translate(200, 430)" filter="url(#dropShadow)">
    <!-- Ceramic Pot -->
    <polygon points="-25,40 -20,95 20,95 25,40" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
    <ellipse cx="0" cy="40" rx="25" ry="10" fill="#0284c7" />
    <!-- Big lush green leaves -->
    <path d="M 0,35 C -25,20 -40,-10 -25,-30 C -10,-10 0,10 0,35 Z" fill="#10b981" stroke="#059669" stroke-width="1.5" />
    <path d="M 0,35 C 25,20 40,-10 25,-30 C 10,-10 0,10 0,35 Z" fill="#34d399" stroke="#059669" stroke-width="1.5" />
    <path d="M 0,35 C -15,5 -30,-45 -5,-65 C 5,-40 0,5 0,35 Z" fill="#059669" stroke="#047857" stroke-width="1.5" />
  </g>
</svg>