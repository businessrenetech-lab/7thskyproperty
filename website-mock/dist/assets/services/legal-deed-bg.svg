<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="plinthTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f4fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="plinthLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="plinthRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#012a4e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00AEEF"/>
    </linearGradient>
    <linearGradient id="glassLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00AEEF" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="gavelWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEEF"/>
      <stop offset="100%" stop-color="#012a4e"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="12" stdDeviation="10" flood-color="#012a4e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Base Isometric Glass Plinth -->
  <g transform="translate(400, 620)">
    <path d="M -240,60 L 0,180 L 0,205 L -240,85 Z" fill="url(#plinthLeft)" />
    <path d="M 0,180 L 240,60 L 240,85 L 0,205 Z" fill="url(#plinthRight)" />
    <path d="M 0,-40 L 240,60 L 0,180 L -240,60 Z" fill="url(#plinthTop)" stroke="#ffffff" stroke-width="2" />
    <path d="M 0,-30 L 220,60 L 0,165 L -220,60 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
  </g>

  <!-- Large 3D Legal Title Deed Document -->
  <g transform="translate(330, 360) rotate(-15)" filter="url(#dropShadow)">
    <rect x="-155" y="-215" width="320" height="420" rx="16" fill="#e0f2fe" stroke="#bae6fd" stroke-width="2" transform="rotate(3)" />
    <rect x="-160" y="-220" width="320" height="420" rx="16" fill="url(#paperGrad)" stroke="#38bdf8" stroke-width="3" />
    
    <rect x="-130" y="-190" width="260" height="38" rx="8" fill="#012a4e" />
    <text x="0" y="-166" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="2">GOVERNMENT TITLE DEED</text>
    <rect x="-130" y="-140" width="160" height="8" rx="4" fill="#00AEEF" />
    <rect x="50" y="-140" width="80" height="8" rx="4" fill="#94a3b8" />

    <rect x="-130" y="-115" width="260" height="5" rx="2.5" fill="#cbd5e1" />
    <rect x="-130" y="-98" width="240" height="5" rx="2.5" fill="#cbd5e1" />
    <rect x="-130" y="-81" width="260" height="5" rx="2.5" fill="#cbd5e1" />
    <rect x="-130" y="-64" width="210" height="5" rx="2.5" fill="#cbd5e1" />
    <rect x="-130" y="-47" width="260" height="5" rx="2.5" fill="#cbd5e1" />
    
    <rect x="-130" y="-25" width="130" height="70" rx="8" fill="#f8fafc" stroke="#00AEEF" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="-65" y="0" fill="#00AEEF" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">AC LAND</text>
    <text x="-65" y="16" fill="#012a4e" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">MUTATION PORCHA</text>
    <text x="-65" y="32" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">✓ VERIFIED</text>

    <rect x="20" y="-20" width="110" height="5" rx="2.5" fill="#cbd5e1" />
    <rect x="20" y="-5" width="95" height="5" rx="2.5" fill="#cbd5e1" />
    <rect x="20" y="10" width="110" height="5" rx="2.5" fill="#cbd5e1" />
    <rect x="20" y="25" width="80" height="5" rx="2.5" fill="#cbd5e1" />

    <rect x="-130" y="65" width="260" height="5" rx="2.5" fill="#cbd5e1" />
    <rect x="-130" y="82" width="250" height="5" rx="2.5" fill="#cbd5e1" />
    <rect x="-130" y="99" width="190" height="5" rx="2.5" fill="#cbd5e1" />

    <g transform="translate(70, 130)">
      <path d="M -15,10 L -30,55 L -10,48 L 5,55 L -5,10 Z" fill="url(#cyanRibbon)" />
      <path d="M 10,10 L 25,55 L 5,48 L -10,55 L 5,10 Z" fill="#0284c7" />
      <circle cx="0" cy="0" r="32" fill="url(#goldSeal)" stroke="#ffffff" stroke-width="2" filter="url(#dropShadow)" />
      <circle cx="0" cy="0" r="26" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="3,3" />
      <path d="M 0,-15 L 4,-4 L 15,-4 L 7,3 L 10,14 L 0,8 L -10,14 L -7,3 L -15,-4 L -4,-4 Z" fill="#ffffff" />
    </g>
  </g>

  <!-- 3D Glass Magnifying Glass -->
  <g transform="translate(490, 310) rotate(25)" filter="url(#dropShadow)">
    <rect x="-12" y="90" width="24" height="130" rx="10" fill="url(#gavelWood)" stroke="#38bdf8" stroke-width="2" />
    <rect x="-14" y="80" width="28" height="14" rx="4" fill="url(#goldSeal)" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#goldSeal)" stroke-width="14" />
    <circle cx="0" cy="0" r="88" fill="none" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="0" r="88" fill="url(#glassLens)" />
    <path d="M -50,-50 A 70 70 0 0 1 50,-50 A 60 60 0 0 0 -50,-50" fill="#ffffff" opacity="0.7" />
    <circle cx="0" cy="0" r="42" fill="#00AEEF" opacity="0.2" />
    <path d="M -18,-2 L -6,12 L 20,-14" fill="none" stroke="#00AEEF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 3D Advocate's Legal Gavel -->
  <g transform="translate(620, 500)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="50" rx="70" ry="30" fill="#0f172a" />
    <ellipse cx="0" cy="45" rx="70" ry="30" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <ellipse cx="0" cy="40" rx="55" ry="22" fill="#334155" />

    <g transform="translate(-20, -10) rotate(-35)">
      <rect x="-35" y="-60" width="70" height="120" rx="16" fill="url(#gavelWood)" stroke="#38bdf8" stroke-width="2" />
      <rect x="-37" y="-20" width="74" height="16" fill="url(#goldSeal)" />
      <rect x="-37" y="10" width="74" height="16" fill="url(#goldSeal)" />
      <rect x="-8" y="0" width="16" height="140" rx="8" fill="url(#gavelWood)" stroke="#ffffff" stroke-width="1" transform="rotate(90)" />
      <circle cx="130" cy="-8" r="14" fill="url(#goldSeal)" />
    </g>
  </g>

  <!-- Floating 100% Legal Security Shield -->
  <g transform="translate(180, 260)" filter="url(#dropShadow)">
    <path d="M 0,-50 L 50,-25 L 50,30 C 50,65 0,90 0,90 C 0,90 -50,65 -50,30 L -50,-25 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="4" />
    <path d="M 0,-38 L 38,-18 L 38,24 C 38,52 0,72 0,72 C 0,72 -38,52 -38,24 L -38,-18 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" />
    <path d="M -16,8 L -4,22 L 20,-8" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>