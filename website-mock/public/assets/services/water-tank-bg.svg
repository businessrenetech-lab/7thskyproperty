<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="wtPlinthTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f4fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="tankBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="waterLevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00AEEF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#012a4e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="jetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEEF"/>
      <stop offset="100%" stop-color="#012a4e"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="12" stdDeviation="10" flood-color="#012a4e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Base Isometric Ripple Plinth -->
  <g transform="translate(380, 620)">
    <path d="M -240,60 L 0,180 L 0,205 L -240,85 Z" fill="#0284c7" opacity="0.85" />
    <path d="M 0,180 L 240,60 L 240,85 L 0,205 Z" fill="#012a4e" opacity="0.95" />
    <path d="M 0,-40 L 240,60 L 0,180 L -240,60 Z" fill="url(#wtPlinthTop)" stroke="#ffffff" stroke-width="2" />
    <!-- Water Ripple Rings on Plinth -->
    <ellipse cx="0" cy="70" rx="190" ry="85" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" stroke-dasharray="8,6" />
    <ellipse cx="0" cy="70" rx="140" ry="60" fill="none" stroke="#00AEEF" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- 3D Cylindrical Water Tank -->
  <g transform="translate(340, 360)" filter="url(#dropShadow)">
    <!-- Tank shadow -->
    <ellipse cx="0" cy="180" rx="140" ry="50" fill="#012a4e" opacity="0.15" />
    
    <!-- Cylinder Body (Wall) -->
    <path d="M -130,20 L -130,170 C -130,205 130,205 130,170 L 130,20 Z" fill="url(#tankBody)" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Water Inside (Transparent Water fill) -->
    <path d="M -125,70 L -125,168 C -125,198 125,198 125,168 L 125,70 C 125,95 -125,95 -125,70 Z" fill="url(#waterLevel)" opacity="0.85" />
    <ellipse cx="0" cy="70" rx="125" ry="32" fill="#38bdf8" opacity="0.7" stroke="#ffffff" stroke-width="1.5" />

    <!-- Stainless Steel Strengthening Ribs / Bands -->
    <path d="M -130,60 C -130,85 130,85 130,60" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
    <path d="M -130,110 C -130,135 130,135 130,110" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
    <path d="M -130,160 C -130,185 130,185 130,160" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />

    <!-- Vertical Inspection Ladder -->
    <g transform="translate(-80, 20)">
      <line x1="-10" y1="0" x2="-10" y2="160" stroke="#ffffff" stroke-width="2.5" />
      <line x1="10" y1="0" x2="10" y2="160" stroke="#ffffff" stroke-width="2.5" />
      <line x1="-10" y1="30" x2="10" y2="30" stroke="#ffffff" stroke-width="2" />
      <line x1="-10" y1="65" x2="10" y2="65" stroke="#ffffff" stroke-width="2" />
      <line x1="-10" y1="100" x2="10" y2="100" stroke="#ffffff" stroke-width="2" />
      <line x1="-10" y1="135" x2="10" y2="135" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Top Cap / Manhole -->
    <ellipse cx="0" cy="20" rx="130" ry="42" fill="#0284c7" stroke="#ffffff" stroke-width="2.5" />
    <ellipse cx="0" cy="15" rx="55" ry="20" fill="#012a4e" stroke="#38bdf8" stroke-width="2" />
    <ellipse cx="0" cy="10" rx="25" ry="10" fill="#38bdf8" />
    
    <!-- Clean Gauge / Meter -->
    <g transform="translate(85, 90)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#00AEEF" stroke-width="3" />
      <path d="M 0,0 L 10,-8" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="0" cy="0" r="4" fill="#012a4e" />
    </g>
  </g>

  <!-- 150-Bar High Pressure Jet Washer Lance & Spray -->
  <g transform="translate(560, 240) rotate(-25)" filter="url(#dropShadow)">
    <!-- Gun Handle -->
    <rect x="-10" y="80" width="20" height="70" rx="6" fill="#012a4e" stroke="#00AEEF" stroke-width="2" />
    <!-- Gun Body -->
    <rect x="-14" y="50" width="80" height="32" rx="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
    <rect x="60" y="58" width="180" height="14" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <!-- High Pressure Rotary Nozzle -->
    <polygon points="240,53 265,60 265,70 240,77" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />
    
    <!-- Rotary Jet Mist / Spray Cone -->
    <polygon points="268,65 370,15 370,115" fill="url(#jetGrad)" opacity="0.75" />
    <ellipse cx="370" cy="65" rx="16" ry="50" fill="#bae6fd" opacity="0.6" />
    <circle cx="390" cy="45" r="8" fill="#ffffff" opacity="0.9" />
    <circle cx="380" cy="85" r="6" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Floating 3D Pure Water Droplets -->
  <g transform="translate(600, 480)" filter="url(#dropShadow)">
    <path d="M 0,-40 C 25,-10 35,15 25,35 C 15,50 -15,50 -25,35 C -35,15 -25,-10 0,-40 Z" fill="#00AEEF" stroke="#ffffff" stroke-width="2.5" />
    <ellipse cx="6" cy="15" rx="8" ry="16" fill="#ffffff" opacity="0.7" transform="rotate(-20 6 15)" />
  </g>
  <g transform="translate(510, 520) scale(0.65)" filter="url(#dropShadow)">
    <path d="M 0,-40 C 25,-10 35,15 25,35 C 15,50 -15,50 -25,35 C -35,15 -25,-10 0,-40 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Certified Pure Water Safety Shield -->
  <g transform="translate(180, 260)" filter="url(#dropShadow)">
    <path d="M 0,-50 L 50,-25 L 50,30 C 50,65 0,90 0,90 C 0,90 -50,65 -50,30 L -50,-25 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="4" />
    <path d="M 0,-38 L 38,-18 L 38,24 C 38,52 0,72 0,72 C 0,72 -38,52 -38,24 L -38,-18 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" />
    <!-- Droplet inside shield -->
    <path d="M 0,-18 C 12,-2 18,10 12,20 C 6,28 -6,28 -12,20 C -18,10 -12,-2 0,-18 Z" fill="#ffffff" />
  </g>
</svg>